name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture final panel formatting (temporary)
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm run format
          node -e "const fs=require('fs');console.log('TIME_TRAVEL_UI_FORMAT '+JSON.stringify(fs.readFileSync('apps/vscode/webview/run.tsx','utf8')))"
      - run: npm run format:check
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
