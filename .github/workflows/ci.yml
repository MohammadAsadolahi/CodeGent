name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Temporarily format and report audit files
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm run format
          node -e "const fs=require('fs');for(const file of [\"apps/vscode/src/app.ts\",\"apps/vscode/src/workspace/time-travel.ts\",\"apps/vscode/test/unit/time-travel.test.ts\",\"apps/vscode/test/webview/panel.test.ts\",\"apps/vscode/test/integration/env.ts\",\"apps/vscode/test/integration/extension.test.ts\",\"CHANGELOG.md\"])console.log('CODEGENT_AUDIT_FORMAT_JSON '+JSON.stringify({file,content:fs.readFileSync(file,'utf8')}))"
      - run: npm run format:check
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Validate VS Code Time Travel integration (temporary)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a npm run test:integration -w apps/vscode -- "restores a historical checkpoint" --suite=protocol
